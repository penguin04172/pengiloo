{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Rankings</h2>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover" id="rankings-table">
        <thead>
            <tr>
                <th>Rank</th>
                <th>Team</th>
                <th>Ranking Points</th>
                <th>Avg RP</th>
                <th>W-L-T</th>
                <th>Total Score</th>
                <th>Played</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be populated by JS -->
        </tbody>
    </table>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadRankings() {
        try {
            const response = await fetch('/api/rankings/');
            const rankings = await response.json();
            const tbody = document.querySelector('#rankings-table tbody');
            tbody.innerHTML = '';

            rankings.forEach(rank => {
                const row = `
                    <tr>
                        <td><strong>${rank.rank}</strong></td>
                        <td>${rank.team_id}</td>
                        <td>${rank.ranking_points}</td>
                        <td>${rank.average_rp.toFixed(2)}</td>
                        <td>${rank.wins}-${rank.losses}-${rank.ties}</td>
                        <td>${rank.total_score}</td>
                        <td>${rank.matches_played}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        } catch (error) {
            console.error('Error loading rankings:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', loadRankings);
</script>
{% endblock %}
